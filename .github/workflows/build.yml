name: Build KAGE MONARK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -nE "error:|\.java:[0-9]+|What went wrong|FAILURE|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
          git config user.name "kage-build"; git config user.email "build@users.noreply.github.com"
          git checkout -b build-log; git add -f build.log; git commit -qm "build log"; git push -f origin build-log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk KAGE-MONARK-SYSTEM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KAGE-MONARK-SYSTEM-apk
          path: KAGE-MONARK-SYSTEM.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KAGE MONARK SYSTEM v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **KAGE-MONARK-SYSTEM.apk** below, open it on your Android phone and install.
            Installing over an older version keeps your data.
          files: KAGE-MONARK-SYSTEM.apk

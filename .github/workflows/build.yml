name: Build KAGE MONARK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk KAGE-MONARK-SYSTEM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KAGE-MONARK-SYSTEM-apk
          path: KAGE-MONARK-SYSTEM.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KAGE MONARK SYSTEM v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **KAGE-MONARK-SYSTEM.apk** below, open it on your Android phone and install.
            Installing over an older version keeps your data.
          files: KAGE-MONARK-SYSTEM.apk

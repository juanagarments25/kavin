name: Build LinkControl native APK

on:
  push:
    branches: [ linkcontrol-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: apps/linkcontrol-native
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: apps/linkcontrol-native
        run: |
          grep -nE "error:|e: |\.kt:[0-9]+|What went wrong|FAILURE|Could not|Unresolved|> Task .* FAILED" build.log | head -60 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done

      - name: Name the APK
        run: cp apps/linkcontrol-native/app/build/outputs/apk/debug/app-debug.apk LinkControl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LinkControl-apk
          path: LinkControl.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linkcontrol-v1.0.${{ github.run_number }}
          name: LinkControl (native) v1.0.${{ github.run_number }}
          make_latest: false
          body: |
            Download **LinkControl.apk** below and install on BOTH phones.
            Real screen view/control needs: a signaling server online, Phone 2 to Approve,
            grant Android screen-capture consent, and enable the Accessibility service.
          files: LinkControl.apk

name: Build LinkControl Source APK

on:
  push:
    branches: [ linkcontrolsource-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: apps/linkcontrolsource-android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: apps/linkcontrolsource-android
        run: |
          grep -nE "error:|\.kt:[0-9]+|What went wrong|FAILURE|Could not|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done

      - name: Name the APK
        run: cp apps/linkcontrolsource-android/app/build/outputs/apk/debug/app-debug.apk LinkControl-Source.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LinkControl-Source-apk
          path: LinkControl-Source.apk

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linkcontrolsource-v1.0.${{ github.run_number }}
          name: LinkControl Source v1.0.${{ github.run_number }}
          make_latest: false
          body: |
            Download **LinkControl-Source.apk** below, open it on your Android phone and install
            (allow "install unknown apps"). Interface preview (tap through all screens) plus the
            full source browser. Preview/demo only — not a real remote-control connection.
          files: LinkControl-Source.apk

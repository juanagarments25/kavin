<style>
/* =========================================================
   LEVEL-UP PANEL — one reusable component, themed by CSS variables
   --a main glow · --b deep flame · --c hot core · --d shadow tint
   --spd animation speed multiplier
   ========================================================= */
#lvDlg{border:0;padding:0;background:transparent;overflow:visible;max-width:min(500px, calc(100vw - 40px));width:100%;margin:auto;color:#fff}
#lvDlg:focus,#lvDlg:focus-visible,#dlgAlert:focus,#dlgAlert:focus-visible{outline:none}
#lvDlg::backdrop{background:rgba(1,2,8,.86);backdrop-filter:blur(3px)}
.lv{--a:#3fe0ff;--b:#2f8bff;--c:#d9f7ff;--d:#06204f;--spd:1}
.lv.t-purple{--a:#c08bff;--b:#7a2bff;--c:#f1e6ff;--d:#25084f}
.lv.t-red{--a:#ff5a6a;--b:#ff2a10;--c:#ffe0d8;--d:#4f0710}
.lv.t-gold{--a:#ffd25a;--b:#ff9d00;--c:#fff6d2;--d:#4a2f00}
.lv.t-monarch{--a:#9b5cff;--b:#ff2a55;--c:#e8f6ff;--d:#05010f}

.lv-stage{--pad:34px;--fh:66px;position:relative;padding:var(--pad) 30px;opacity:0;transform:scale(.86)}
.lv-stage.lv-show{animation:lvIn calc(.5s / var(--spd)) cubic-bezier(.2,.9,.25,1.15) forwards}
.lv-stage.lv-hide{animation:lvOut calc(.35s / var(--spd)) ease-in forwards}
@keyframes lvIn{0%{opacity:0;transform:scale(.86) translateY(14px)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes lvOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.06)}}

.lv-embers{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);pointer-events:none}
.lv-aura{position:absolute;inset:-10%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--b) 55%, transparent), color-mix(in srgb, var(--d) 60%, transparent) 55%, transparent 75%);
  animation:lvAura calc(2.4s / var(--spd)) ease-in-out infinite}
@keyframes lvAura{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.t-monarch .lv-aura{background:conic-gradient(from 0deg, rgba(47,139,255,.45), rgba(155,92,255,.5), rgba(255,42,85,.45), rgba(5,1,15,.7), rgba(47,139,255,.45));
  filter:blur(28px);animation:lvSpin calc(6s / var(--spd)) linear infinite}
@keyframes lvSpin{to{transform:rotate(360deg)}}

/* flames: rows of tongues along the top and bottom edges, fire walls on the sides */
.lv-flames{position:absolute;left:5%;right:5%;height:var(--fh);display:flex;justify-content:space-between;pointer-events:none;z-index:0}
.lv-f-top{top:calc(var(--pad) - var(--fh) + 12px)}
.lv-f-bottom{bottom:calc(var(--pad) - var(--fh) + 14px);z-index:2;opacity:.85}
.lv-flames i{flex:1;max-width:40px;height:100%;margin:0 -6px;
  clip-path:polygon(50% 0,64% 22%,80% 46%,96% 72%,86% 100%,14% 100%,4% 72%,20% 46%,36% 22%);
  background:radial-gradient(ellipse 60% 70% at 50% 92%, var(--c) 0 14%, var(--a) 34%, var(--b) 62%, transparent 82%);
  filter:blur(1.6px);mix-blend-mode:screen;opacity:.92;transform-origin:50% 100%;
  animation:tongue calc(var(--t, .9s) / var(--spd)) ease-in-out infinite alternate;animation-delay:var(--dl, 0s)}
@keyframes tongue{0%{transform:scaleY(.5) scaleX(.85) translateY(6px)}55%{transform:scaleY(1.08) scaleX(1)}100%{transform:scaleY(.78) scaleX(1.12) skewX(var(--sk, 5deg))}}
.lv-side{position:absolute;top:10%;bottom:10%;width:34px;pointer-events:none;z-index:0;mix-blend-mode:screen;opacity:.8;
  background:radial-gradient(ellipse 60% 18% at 50% 50%, var(--a), transparent 70%) 0 0/100% 70px repeat-y,
             radial-gradient(ellipse 40% 12% at 30% 50%, var(--c), transparent 70%) 0 30px/100% 90px repeat-y;
  filter:blur(3px);animation:wall calc(1.6s / var(--spd)) linear infinite}
.lv-side.l{left:-6px}.lv-side.r{right:-6px;animation-direction:reverse}
@keyframes wall{to{background-position:0 -70px, 0 -60px}}
.t-monarch .lv-flames i:nth-child(4n+1){--a:#3fe0ff;--b:#2f8bff}
.t-monarch .lv-flames i:nth-child(4n+2){--a:#c08bff;--b:#7a2bff}
.t-monarch .lv-flames i:nth-child(4n+3){--a:#ff5a6a;--b:#ff2a10}
.t-monarch .lv-flames i:nth-child(4n){--a:#4a2a7a;--b:#0a0418;--c:#b9a6ff}

/* the panel itself */
.lv-wrap{position:relative;z-index:1;filter:drop-shadow(0 0 8px var(--a)) drop-shadow(0 0 26px color-mix(in srgb, var(--b) 70%, transparent))}
.lv-frame{--k:20px;padding:2px;background:linear-gradient(160deg, var(--c), var(--a) 25%, var(--b) 55%, var(--a) 80%, var(--c));
  clip-path:polygon(var(--k) 0,calc(50% - 30px) 0,calc(50% - 16px) 9px,calc(50% + 16px) 9px,calc(50% + 30px) 0,calc(100% - var(--k)) 0,100% var(--k),100% calc(100% - var(--k)),calc(100% - var(--k)) 100%,var(--k) 100%,0 calc(100% - var(--k)),0 var(--k))}
.t-monarch .lv-frame{background:conic-gradient(from var(--ang, 0deg), #3fe0ff, #9b5cff, #ff2a55, #1a0830, #3fe0ff);animation:lvAng calc(4s / var(--spd)) linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes lvAng{to{--ang:360deg}}
.lv-in{position:relative;overflow:hidden;clip-path:inherit;padding:24px 22px 18px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--b) 26%, transparent), transparent 60%),
             radial-gradient(90% 60% at 50% 100%, color-mix(in srgb, var(--d) 90%, transparent), transparent 70%),
             linear-gradient(180deg,#04060e,#020309)}
.lv-in::after{content:"";position:absolute;inset:11px;border:1px solid color-mix(in srgb, var(--a) 35%, transparent);pointer-events:none}
.lv-in > *{position:relative;z-index:1}
.lv-head{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border:1px solid color-mix(in srgb, var(--c) 60%, transparent);
  font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--c);text-shadow:0 0 8px var(--a);box-shadow:inset 0 0 14px color-mix(in srgb, var(--a) 25%, transparent)}
.lv-head b{width:20px;height:20px;border:1.5px solid var(--c);border-radius:50%;display:grid;place-items:center;font-size:11px;letter-spacing:0}
.lv-core{position:absolute;left:50%;top:44px;width:min(340px,90%);height:120px;transform:translateX(-50%);z-index:0 !important;pointer-events:none;opacity:.55}
.lv-core.lv-flames{left:50%;right:auto;transform:translateX(-50%);justify-content:center}
.lv-core.lv-flames i{max-width:60px;margin:0 -10px}
.lv-title{font-family:var(--font-head);font-weight:900;font-size:clamp(34px,9vw,54px);letter-spacing:.08em;margin:18px 0 6px;line-height:1.05;color:#fff;
  text-shadow:0 0 10px var(--a),0 0 26px var(--a),0 0 50px var(--b);animation:lvTitle calc(1.4s / var(--spd)) ease-in-out infinite}
@keyframes lvTitle{0%,100%{text-shadow:0 0 10px var(--a),0 0 26px var(--a),0 0 50px var(--b)}50%{text-shadow:0 0 14px var(--c),0 0 34px var(--a),0 0 70px var(--b)}}
.lv-levels{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-family:var(--font-head);font-weight:700;font-size:clamp(15px,4.4vw,20px);
  letter-spacing:.1em;font-variant-numeric:tabular-nums}
.lv-levels span{color:color-mix(in srgb, var(--c) 70%, #8a9cc4)}
.lv-levels span:last-child{color:#fff;text-shadow:0 0 10px var(--a)}
.lv-levels b{color:var(--a);text-shadow:0 0 8px var(--a)}
.lv-rank{margin-top:14px;font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--c);text-shadow:0 0 8px var(--a)}
.lv-rank em{display:block;font-style:normal;font-size:22px;letter-spacing:.14em;color:#fff;margin-top:4px;text-shadow:0 0 12px var(--a),0 0 30px var(--b)}
.lv-unlock{margin-top:8px;font-size:14px;letter-spacing:.14em;color:var(--a);text-transform:uppercase;font-weight:700}
.lv-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 10px}
.lv-stats div{border:1px solid color-mix(in srgb, var(--a) 30%, transparent);padding:7px 4px;background:color-mix(in srgb, var(--d) 50%, transparent)}
.lv-stats dt{font-family:var(--font-head);font-size:8.5px;letter-spacing:.18em;color:color-mix(in srgb, var(--c) 70%, #8a9cc4)}
.lv-stats dd{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:#fff}
.lv-bar{height:8px;border-color:color-mix(in srgb, var(--a) 40%, transparent)}
.lv-bar i{background:linear-gradient(90deg, var(--b), var(--a), var(--c));box-shadow:0 0 12px var(--a)}
.lv-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.lv-count{font-family:var(--font-head);font-size:11px;letter-spacing:.2em;color:color-mix(in srgb, var(--c) 70%, #8a9cc4);font-variant-numeric:tabular-nums}
.lv-skip{border:1px solid color-mix(in srgb, var(--c) 55%, transparent);background:color-mix(in srgb, var(--d) 60%, transparent);color:#fff;padding:8px 14px;
  font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:.2em;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.lv-skip:hover{background:color-mix(in srgb, var(--b) 45%, transparent)}
.lv-bolts{position:absolute;inset:0;pointer-events:none;z-index:0 !important;opacity:0}
.t-blue .lv-bolts,.t-monarch .lv-bolts{opacity:1}
.lv-bolts path{fill:none;stroke:var(--c);stroke-width:1.6;filter:drop-shadow(0 0 4px var(--a));opacity:0;animation:bolt calc(2.2s / var(--spd)) steps(1) infinite}
.lv-bolts path:nth-child(2){animation-delay:-.7s}.lv-bolts path:nth-child(3){animation-delay:-1.4s}
@keyframes bolt{0%,7%{opacity:.95}8%,100%{opacity:0}}
.lv-preview{position:absolute;top:8px;right:14px;z-index:2;font-family:var(--font-head);font-size:9px;letter-spacing:.24em;color:var(--c);opacity:.8}

/* theme transformation (e.g. blue → purple at level 10) */
.lv-flash{position:absolute;inset:-30px;z-index:3;pointer-events:none;opacity:0;border-radius:24px;
  background:radial-gradient(closest-side, #fff, color-mix(in srgb, var(--a) 70%, transparent) 40%, transparent 72%)}
.lv.transforming .lv-flash{animation:lvFlash calc(1.1s / var(--spd)) ease-out forwards}
.lv.transforming .lv-wrap{animation:lvAwaken calc(1.1s / var(--spd)) cubic-bezier(.2,.9,.25,1.2)}
@keyframes lvFlash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes lvAwaken{0%{transform:scale(1)}30%{transform:scale(.94);filter:brightness(2.2) drop-shadow(0 0 30px var(--c))}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* low effects + flames off */
.lv.low .lv-embers,.lv.low .lv-side,.lv.low .lv-bolts,.lv.low .lv-core{display:none}
.lv.low .lv-flames i{filter:none;animation-duration:calc(1.6s / var(--spd))}
.lv.low .lv-flames i:nth-child(even){display:none}
.lv.low .lv-wrap{filter:drop-shadow(0 0 8px var(--a))}
.lv.low .lv-aura{animation:none;filter:none}
.lv.noflames .lv-flames,.lv.noflames .lv-side{display:none}
@media (max-width:600px){ .lv-stage{--pad:30px;--fh:52px;padding:var(--pad) 14px} .lv-in{padding:22px 14px 16px} .lv-side{width:24px} }
@media (prefers-reduced-motion: reduce){ .lv-flames i,.lv-side,.lv-aura,.lv-bolts path,.lv-title{animation:none !important} }

/* rank badge follows the level theme */
.rank .badge[data-lv=purple]{border-color:#c08bff;box-shadow:0 0 12px rgba(192,139,255,.55)}
.rank .badge[data-lv=red]{border-color:#ff5a6a;color:#ffd6d6;background:rgba(255,42,16,.14);box-shadow:0 0 12px rgba(255,90,106,.5)}
.rank .badge[data-lv=gold]{border-color:#ffd25a;color:#fff1c4;background:rgba(255,157,0,.14);box-shadow:0 0 12px rgba(255,210,90,.5)}
.rank .badge[data-lv=monarch]{border-color:#ff2a55;color:#fff;background:linear-gradient(90deg,rgba(47,139,255,.25),rgba(155,92,255,.25),rgba(255,42,85,.25));box-shadow:0 0 14px rgba(155,92,255,.6)}
.rank .badge[data-lv=blue]{border-color:#3fe0ff;color:#dff6ff;background:rgba(47,139,255,.15);box-shadow:0 0 12px rgba(63,224,255,.45)}
.thr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thr label{font-size:11px}
@media (max-width:600px){ .thr{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* =========================================================
   SHADOW SYSTEM MESSAGE — universal panel additions (v3.2)
   ========================================================= */
/* purple shadow flames over electric-blue borders; gold is black-and-gold; monarch is blue/purple/black */
.lv{--fa:var(--a);--fb:var(--b);--fc:var(--c)}
.lv.t-blue{--fa:#8a6bff;--fb:#3a1fb0;--fc:#9fe9ff}
.lv.t-gold{--a:#ffd25a;--b:#b07a00;--c:#fff3c8;--d:#000000;--fa:#ffcf4d;--fb:#3a2600;--fc:#fff6d6}
.lv.t-gold .lv-frame{background:linear-gradient(160deg,#fff3c8,#ffd25a 18%,#2a1d00 46%,#0a0700 54%,#ffd25a 82%,#fff3c8)}
.lv.t-gold .lv-in{background:radial-gradient(120% 70% at 50% 0%, rgba(255,210,90,.16), transparent 60%), linear-gradient(180deg,#050402,#000)}
.lv.t-monarch{--a:#7a5cff;--b:#2f8bff;--c:#e8f6ff;--d:#030008}
.lv.t-monarch .lv-frame{background:conic-gradient(from var(--ang, 0deg), #3fe0ff, #9b5cff, #000, #2f1a6e, #3fe0ff)}
.lv.t-monarch .lv-aura{background:conic-gradient(from 0deg, rgba(47,139,255,.45), rgba(155,92,255,.5), rgba(0,0,0,.8), rgba(60,20,140,.55), rgba(47,139,255,.45))}
.lv.t-monarch .lv-flames i:nth-child(4n+1){--fa:#3fe0ff;--fb:#1747b8;--fc:#d9f7ff}
.lv.t-monarch .lv-flames i:nth-child(4n+2){--fa:#b07cff;--fb:#5a2bd6;--fc:#efe2ff}
.lv.t-monarch .lv-flames i:nth-child(4n+3){--fa:#3b2a6e;--fb:#05020f;--fc:#9fa8ff}
.lv.t-monarch .lv-flames i:nth-child(4n){--fa:#6b3cff;--fb:#0a0418;--fc:#c9b8ff}
.lv-flames i{background:radial-gradient(ellipse 60% 70% at 50% 92%, var(--fc) 0 14%, var(--fa) 34%, var(--fb) 62%, transparent 82%)}
.lv-side{background:radial-gradient(ellipse 60% 18% at 50% 50%, var(--fa), transparent 70%) 0 0/100% 70px repeat-y,
                    radial-gradient(ellipse 40% 12% at 30% 50%, var(--fc), transparent 70%) 0 30px/100% 90px repeat-y}

/* reveal: dark energy gathers, then the panel resolves */
.lv-stage.lv-show .lv-in{animation:smReveal calc(.7s / var(--spd)) ease-out both}
@keyframes smReveal{0%{filter:brightness(.2) blur(6px);transform:scaleY(.06);opacity:.4}45%{filter:brightness(1.6) blur(1px);transform:scaleY(1.02);opacity:1}100%{filter:none;transform:none;opacity:1}}
.lv-stage.lv-show .lv-wrap::before{content:"";position:absolute;inset:-6px;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--fa) 55%, transparent), transparent 75%);animation:smPulse calc(2.2s / var(--spd)) ease-in-out infinite}
@keyframes smPulse{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.8;transform:scale(1.03)}}

/* metallic, commanding type */
.lv-head span{font:inherit}
.lv-title{background:linear-gradient(180deg,#ffffff 0%,#e4eeff 38%,#8fa5c9 52%,#f4f8ff 68%,#c9d6ee 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 8px var(--a)) drop-shadow(0 0 22px color-mix(in srgb, var(--b) 80%, transparent));animation:smTitle calc(1.6s / var(--spd)) ease-in-out infinite;
  font-size:clamp(28px,7.4vw,46px);letter-spacing:.1em;text-transform:uppercase}
.lv.calm .lv-title{font-size:clamp(22px,6vw,34px)}
@keyframes smTitle{0%,100%{filter:drop-shadow(0 0 8px var(--a)) drop-shadow(0 0 22px color-mix(in srgb, var(--b) 80%, transparent))}50%{filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 0 34px var(--a))}}
.sm-name{margin-top:10px;font-family:var(--font-head);font-weight:700;font-size:clamp(15px,4.4vw,20px);letter-spacing:.12em;text-transform:uppercase;color:#f1f6ff;
  text-shadow:0 0 10px color-mix(in srgb, var(--a) 70%, transparent);word-break:break-word}
.sm-ranks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.sm-ranks div{border:1px solid color-mix(in srgb, var(--a) 35%, transparent);padding:8px 6px;background:color-mix(in srgb, var(--d) 55%, transparent)}
.sm-ranks dt{font-family:var(--font-head);font-size:9px;letter-spacing:.2em;color:color-mix(in srgb, var(--c) 65%, #8a9cc4)}
.sm-ranks dd{font-family:var(--font-head);font-weight:900;font-size:22px;letter-spacing:.1em;color:#fff;text-shadow:0 0 10px var(--a)}
.sm-ranks div:first-child dd{color:#9aa8c4;text-shadow:none}
.lv-unlock{font-family:var(--font-head);font-size:11px;letter-spacing:.3em;margin-top:12px}
.sm-reward{display:inline-block;margin-top:10px;padding:6px 16px;font-family:var(--font-head);font-weight:900;font-size:clamp(18px,5vw,24px);letter-spacing:.12em;color:#fff;
  border-top:1px solid color-mix(in srgb, var(--a) 60%, transparent);border-bottom:1px solid color-mix(in srgb, var(--a) 60%, transparent);
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--b) 30%, transparent), transparent);text-shadow:0 0 10px var(--a),0 0 24px var(--b)}
.sm-detail{margin-top:12px;color:#c9d6ee;font-size:15px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.sm-meta{margin-top:10px}
.sm-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.sm-acts .qi-btn{border-color:color-mix(in srgb, var(--c) 55%, transparent);text-shadow:0 0 6px var(--a)}
.sm-acts .qi-btn.main{background:linear-gradient(135deg, color-mix(in srgb, var(--b) 75%, transparent), color-mix(in srgb, var(--a) 45%, transparent))}
.sm-btns{display:flex;gap:6px}
.lv-bar{margin-top:12px}

/* ordinary award messages: restrained flames; level-ups keep the full effect */
.lv.calm .lv-side,.lv.calm .lv-bolts{display:none}
.lv.calm .lv-flames{--fh:44px;opacity:.6}
.lv.calm .lv-core{display:none}
.lv.calm .lv-aura{opacity:.6}

/* warnings: same panel, cold red signal on the kicker and status */
.lv.is-warning .lv-head{color:#ff9aa8;border-color:rgba(255,90,106,.6);text-shadow:0 0 8px #ff2a55}
.lv.is-warning .lv-head b{border-color:#ff9aa8}
.lv.is-warning .lv-unlock{color:#ff7d8f;text-shadow:0 0 8px rgba(255,42,85,.6)}

/* special milestone levels (theme thresholds): heavier transformation */
.lv.transforming.intense .lv-flash{animation-duration:calc(1.6s / var(--spd))}
.lv.transforming.intense .lv-frame{animation:smShake calc(.6s / var(--spd)) ease-in-out 1}
.lv.transforming.intense .lv-aura{animation:smSurge calc(1.6s / var(--spd)) ease-out 1}
@keyframes smShake{0%,100%{translate:0 0}20%{translate:-4px 2px}40%{translate:4px -2px}60%{translate:-3px -1px}80%{translate:2px 1px}}
@keyframes smSurge{0%{opacity:.4;transform:scale(.8)}40%{opacity:1;transform:scale(1.25)}100%{opacity:.8;transform:scale(1)}}

/* resume pending messages */
.sm-resume{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;border:1px solid var(--cyan);background:rgba(4,10,26,.92);color:#eaf9ff;
  padding:10px 14px;font-family:var(--font-head);font-size:10px;font-weight:700;letter-spacing:.18em;box-shadow:0 0 16px rgba(63,224,255,.35);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
@media (max-width:760px){ .sm-resume{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
.lv.low .lv-stage.lv-show .lv-in{animation:none}
.lv.low .lv-wrap::before{display:none}
@media (prefers-reduced-motion: reduce){ .lv-stage.lv-show .lv-in,.lv-wrap::before,.lv-stage{animation:none !important} .lv-stage.lv-show{opacity:1;transform:none} }

/* =========================================================
   MONARK RANK STYLE (admin setting) — E blue · D cyan · C blood red · B orange · A electric · S purple
   ========================================================= */
.lv.t-cyan{--a:#3ff0ff;--b:#0b8fae;--c:#dcfdff;--d:#00161c;--fa:#3ff0ff;--fb:#06506a;--fc:#e6feff}
.lv.t-orange{--a:#ff8a1f;--b:#b04800;--c:#ffe6cc;--d:#1a0b00;--fa:#ff9a3a;--fb:#7a2a00;--fc:#fff0d8}
